[workspace]
resolver = "2"
members = ["core", "ui", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kurodaki"]
license = "MIT"

[workspace.dependencies]
naute-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.release.package.naute-ui]
opt-level = "z"
