[package]
name = "naute"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Naute — notes, sheets, designs and slides with private on-device dictation"

[lib]
name = "naute_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["stt"]
# On-device speech to text through transcribe.cpp, the engine Handy uses.
stt = ["dep:transcribe-cpp"]

[dependencies]
naute-core.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
resvg = "0.45"
svg2pdf = "0.13"
rust_xlsxwriter = "0.90"
docx-rs = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
ttf-parser = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
log = "0.4"
pdf-writer = "0.12"

# Apple Silicon uses Metal; everything else runs the portable CPU backend
# (same split as Handy).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false, features = ["metal"], optional = true }

[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false, optional = true }
